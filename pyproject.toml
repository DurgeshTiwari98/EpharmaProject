[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epharma-analytics"
version = "0.1.0"
description = "Data science workflows for the E-Pharma Management System."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
]

[project.optional-dependencies]
full = [
    "fastparquet>=2024.5.0",
    "faker>=25.0.0",
    "imbalanced-learn>=0.12",
    "lightgbm>=4.3",
    "mlflow>=2.13",
    "optuna>=3.6",
    "plotly>=5.22",
    "prophet>=1.1.5",
    "pyarrow>=16.0",
    "shap>=0.45",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "ydata-profiling>=4.8",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
epharma-generate-data = "epharma.data.synthetic:main"
epharma-preprocess = "epharma.preprocessing.pipeline:main"
epharma-run-eda = "epharma.eda.reports:main"
epharma-train-models = "epharma.models.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
